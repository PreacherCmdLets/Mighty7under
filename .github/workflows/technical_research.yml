name: Technical Research

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: 'Single ticker (leave blank for all Primary Focus)'
        required: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install chromium --with-deps

      - name: Generate technical research
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.ticker }}" ]; then
            python scripts/generate_technical.py --ticker ${{ github.event.inputs.ticker }}
          else
            python scripts/generate_technical.py
          fi

      - name: Commit and push reports
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/research/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "research: technical update [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git pull --rebase origin main
            git push origin HEAD
          fi
