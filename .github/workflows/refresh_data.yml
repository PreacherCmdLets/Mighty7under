name: Refresh Dashboard Data

on:
  schedule:
    - cron: "35 21 * * 1-5"   # Weekdays 4:35 PM CT — market data
    - cron: "35 13 * * 1-5"   # Weekdays 8:35 AM CT — market data
    - cron: "0 0 * * 0"       # Sunday midnight UTC — watchlist scrape + fundamental research
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ── Job 1: Fetch market data, watchlists, fundamental research ───────────
  fetch-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python: market snapshot ──────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build market data
        run: python scripts/build_data.py --out-dir data

      # ── Node.js: watchlist scraper (Sundays + manual only) ──────────────
      - name: Set up Node.js
        if: github.event.schedule == '0 0 * * 0' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node dependencies
        if: github.event.schedule == '0 0 * * 0' || github.event_name == 'workflow_dispatch'
        run: npm ci

      - name: Install Playwright browsers (Node)
        if: github.event.schedule == '0 0 * * 0' || github.event_name == 'workflow_dispatch'
        run: npx playwright install chromium --with-deps

      - name: Scrape TradingView watchlists
        if: github.event.schedule == '0 0 * * 0' || github.event_name == 'workflow_dispatch'
        run: node scripts/scrape_watchlists.js

      # ── Python Playwright: fundamental research (Sundays + manual only) ─
      - name: Install Playwright browsers (Python)
        if: github.event.schedule == '0 0 * * 0' || github.event_name == 'workflow_dispatch'
        run: python -m playwright install chromium --with-deps

      - name: Generate fundamental research
        if: github.event.schedule == '0 0 * * 0' || github.event_name == 'workflow_dispatch'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_fundamental.py

      # ── Commit everything ─────────────────────────────────────────────────
      - name: Commit and push data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: refresh snapshot + watchlists + research [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git push origin HEAD
          fi

  # ── Job 2: Technical chart analysis (on-demand only) ─────────────────────
  generate-technical:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install chromium --with-deps

      - name: Generate technical research
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_technical.py

      - name: Commit technical reports
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/research/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "research: technical analysis update [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git push origin HEAD
          fi

  # ── Job 3: Deploy to GitHub Pages ─────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: fetch-data
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
