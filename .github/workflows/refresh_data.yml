name: Refresh Dashboard Data

on:
  schedule:
    - cron: "35 21 * * 1-5"   # Weekdays 4:35 PM CT — market data
    - cron: "35 13 * * 1-5"   # Weekdays 8:35 AM CT — market data
    - cron: "0 0 * * 0"       # Sunday midnight UTC — watchlist scrape
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ── Job 1: Fetch all data and commit to repo ──────────────────────────────
  fetch-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python: market snapshot ──────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build market data
        run: python scripts/build_data.py --out-dir data

      # ── Node.js: watchlist scraper (runs every Sunday) ───────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Scrape TradingView watchlists
        run: node scripts/scrape_watchlists.js

      # ── Commit everything ─────────────────────────────────────────────────
      - name: Commit and push data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: refresh snapshot + watchlists [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git push origin HEAD
          fi

  # ── Job 2: Deploy to GitHub Pages (runs after Job 1 finishes) ────────────
  deploy:
    runs-on: ubuntu-latest
    needs: fetch-data
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
