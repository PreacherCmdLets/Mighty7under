name: Refresh Dashboard Data

on:
  schedule:
    # 21:35 UTC = 16:35 ET  —  daily after US market close (Mon–Fri)
    - cron: "35 21 * * 1-5"
    # 13:35 UTC = 09:35 ET  —  shortly after market open (Mon–Fri)
    - cron: "35 13 * * 1-5"
    # 12:30 UTC = 08:30 ET  —  pre-market gappers, an hour before the open.
    # Cron is UTC-only, so this lands at 07:30 ET under EST; still inside the
    # 04:00–09:30 ET window that run_scans.py gates the pre-market scan on.
    - cron: "30 12 * * 1-5"
  workflow_dispatch:          # Manual trigger from GitHub Actions UI

permissions:
  contents: write             # commit data/ back to repo

# Never run two refreshes at once — parallel runs race on the data commits
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh-data:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so we can push back

      # ── 2. Python setup ────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ── 3. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 4. Run data pipeline ───────────────────────────────────────────────
      - name: Build market data
        run: python scripts/build_data.py --out-dir data

      # ── 4b. Run TradingView screener scans ─────────────────────────────────
      # Non-fatal: if TradingView blocks or rate-limits the runner, the step
      # exits non-zero without touching data/scans.json, so the site keeps
      # serving the last good scan results instead of an empty board.
      - name: Run TradingView scans
        continue-on-error: true
        run: python scripts/run_scans.py --out-dir data

      # ── 4b2. StockBee-style market breadth counts ──────────────────────────
      # ~15 tiny scanner calls that read only totalCount. Appends one row per
      # session to data/breadth_history.json; the 5/10-day ratios need that
      # history because the scanner is point-in-time.
      - name: Build market monitor
        continue-on-error: true
        run: python scripts/breadth_monitor.py --out-dir data

      # ── 4b4. Finviz saved screens ──────────────────────────────────────────
      # 14 screens, spaced ~1.5s apart. Same Cloudflare caveat as the news step.
      - name: Run Finviz screens
        continue-on-error: true
        run: python scripts/finviz_screens.py --out-dir data

      # ── 4b5. Economic calendar (Nasdaq) ────────────────────────────────────
      # finviz retired its economic calendar and TradingView's widget script
      # now 403s, so events.json comes from Nasdaq's public JSON endpoint.
      - name: Fetch economic calendar
        continue-on-error: true
        run: python scripts/fetch_calendar.py --out-dir data

      # ── 4c. Finviz catalyst news ───────────────────────────────────────────
      # Runs after the scans so it can pull news for the tickers they caught.
      # Non-fatal: finviz is behind Cloudflare and blocks by IP reputation, so
      # a Wall leaves the previous events.json / news.json in place.
      - name: Fetch calendar and news
        continue-on-error: true
        run: python scripts/fetch_news.py --out-dir data

      # ── 5. Commit refreshed data back to repo ──────────────────────────────
      - name: Commit data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          # Only commit if something changed
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: refresh market snapshot [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            # Data files are generated — on conflict, keep this run's fresh build
            git pull --rebase -X theirs origin main
            git push origin HEAD
          fi

      # Publishing moved to deploy.yml, which fires on every push to main —
      # so a merged PR reaches the site immediately instead of waiting for the
      # next scheduled refresh, and the data commit above triggers it too.
