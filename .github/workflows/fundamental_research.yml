name: Fundamental Research

on:
  schedule:
    - cron: "0 1 * * 0"   # Sunday 1:00 AM UTC (after watchlist scrape finishes)
  workflow_dispatch:
    inputs:
      ticker:
        description: 'Single ticker (leave blank for all Primary Focus)'
        required: false
      force:
        description: 'Force regenerate (ignore cache)'
        type: boolean
        default: false
      model:
        description: 'Model to use'
        type: choice
        options:
          - haiku
          - sonnet
        default: haiku

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install chromium --with-deps

      - name: Generate fundamental research
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS="--model ${{ github.event.inputs.model || 'haiku' }}"
          if [ -n "${{ github.event.inputs.ticker }}" ]; then
            ARGS="$ARGS --ticker ${{ github.event.inputs.ticker }}"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          python scripts/generate_fundamental.py $ARGS

      - name: Commit and push reports
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/research/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "research: fundamental update [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git pull --rebase origin main
            git push origin HEAD
          fi
