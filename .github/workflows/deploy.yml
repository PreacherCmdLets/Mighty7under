name: Deploy Pages

# Publishes the site whenever main changes — a merged PR, or a data commit
# from any of the pipeline workflows.
#
# Until this existed, GitHub Pages was only published as the last two steps of
# refresh_data.yml, which runs on a schedule. Merging a PR therefore changed
# main without changing the site: code sat undeployed until the next scheduled
# data refresh, up to about eight hours later.
#
# `push` alone is NOT enough, and relying on it froze the site for five days.
# GitHub deliberately suppresses push-triggered workflows for commits made with
# GITHUB_TOKEN, so the pipeline's own data commits — pushed by
# github-actions[bot] — never fired this. `workflow_run` covers them: it fires
# when a data workflow finishes, whoever pushed. `push` still covers human
# merges, which is the faster path for a code change.
on:
  push:
    branches: [main]
  workflow_run:
    workflows:
      - "Refresh Dashboard Data"
      - "Scrape Watchlists"
      - "Backtest Scans"
      - "Backfill Market Monitor"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages allows one deployment at a time. Superseding an in-flight deploy is
# correct here: the newest commit is the one worth publishing.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # On a workflow_run the default checkout is the SHA that started the
          # triggering workflow — i.e. before its data commit. Take main's head
          # so the deploy carries the data that run just produced.
          ref: main

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."             # serve entire repo root

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
